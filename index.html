<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escanea — escáner de documentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  // Debe existir ANTES de cargar opencv.js
  var cvReady = false;
  var Module = {
    onRuntimeInitialized(){ cvReady = true; console.log('OpenCV.js listo'); }
  };
</script>
<script async src="https://docs.opencv.org/4.x/opencv.js" onerror="console.warn('No se pudo cargar OpenCV.js, el recorte será manual')"></script>
<style>
  :root{
    --ink:#12151b;
    --paper:#f4f3ef;
    --panel:#ffffff;
    --steel:#5b6472;
    --line:#e2e0d8;
    --laser:#00c896;
    --laser-dim:rgba(0,200,150,0.14);
    --danger:#c4453a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding-bottom:110px;
  }
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 40px;}

  header.app-header{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:16px;margin-bottom:26px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand svg{width:42px;height:42px;flex-shrink:0;}
  .brand h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;font-weight:700;margin:0;letter-spacing:-0.01em;
  }
  .brand p{margin:2px 0 0;color:var(--steel);font-size:13.5px;}
  .counter{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;color:var(--steel);
    border:1px solid var(--line);
    background:var(--panel);
    padding:8px 12px;border-radius:10px;
    white-space:nowrap;
  }
  .counter b{color:var(--ink);font-weight:600;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:20px;
  }

  .action-row{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;font-size:14px;
    border-radius:10px;border:1px solid var(--line);
    padding:12px 16px;cursor:pointer;
    display:flex;align-items:center;gap:8px;
    background:var(--panel);color:var(--ink);
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .btn svg{width:18px;height:18px;flex-shrink:0;}
  .btn:hover{border-color:var(--ink);}
  .btn:active{transform:scale(0.97);}
  .btn.primary{
    background:var(--ink);color:var(--paper);border-color:var(--ink);
  }
  .btn.primary:hover{background:#000;}
  .btn.laser{
    background:var(--laser);color:#04241c;border-color:var(--laser);
  }
  .btn.ghost{background:transparent;}
  .btn:focus-visible{outline:2px solid var(--laser);outline-offset:2px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

  .mode-row{
    display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;
    padding-top:16px;border-top:1px dashed var(--line);
  }
  .mode-row .label{font-size:12.5px;color:var(--steel);font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;}
  .segmented{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .segmented button{
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;
    padding:9px 14px;border:none;background:var(--panel);color:var(--steel);cursor:pointer;
    border-right:1px solid var(--line);
  }
  .segmented button:last-child{border-right:none;}
  .segmented button.active{background:var(--ink);color:var(--paper);}

  input[type=file]{display:none;}

  .pages{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:16px;
  }
  .empty-state{
    text-align:center;padding:50px 20px;color:var(--steel);
  }
  .empty-state svg{width:56px;height:56px;opacity:.5;margin-bottom:10px;}
  .empty-state p{font-size:14px;margin:4px 0;}
  .empty-state .hint{font-family:'IBM Plex Mono',monospace;font-size:12px;}

  .page-card{
    position:relative;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,0.03), 0 6px 14px -10px rgba(0,0,0,0.25);
  }
  .page-card .thumb-wrap{
    aspect-ratio:3/4;overflow:hidden;background:#eee;position:relative;
  }
  .page-card img{width:100%;height:100%;object-fit:cover;display:block;}
  .page-index{
    position:absolute;top:6px;left:6px;
    background:rgba(18,21,27,0.78);color:#fff;
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    padding:2px 7px;border-radius:6px;
  }
  .page-tools{
    display:flex;justify-content:space-between;align-items:center;
    padding:7px 8px;background:var(--panel);border-top:1px solid var(--line);
  }
  .page-tools button{
    border:none;background:transparent;cursor:pointer;color:var(--steel);
    padding:5px;border-radius:6px;display:flex;
  }
  .page-tools button:hover{color:var(--ink);background:var(--paper);}
  .page-tools button.del:hover{color:var(--danger);}
  .page-tools svg{width:16px;height:16px;}

  /* scanning overlay (mejora de imagen) */
  .scan-overlay{
    position:fixed;inset:0;background:rgba(18,21,27,0.86);
    display:none;align-items:center;justify-content:center;z-index:50;
    flex-direction:column;gap:16px;
  }
  .scan-overlay.active{display:flex;}
  .scan-stage{
    position:relative;width:220px;height:290px;
    background:#1c2028;border-radius:10px;overflow:hidden;
    border:1px solid #2c3240;
  }
  .scan-stage img{width:100%;height:100%;object-fit:cover;opacity:.85;}
  .scan-beam{
    position:absolute;left:0;right:0;height:3px;
    background:linear-gradient(90deg, transparent, var(--laser), transparent);
    box-shadow:0 0 14px 3px var(--laser);
    animation:sweep 1.35s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{top:0%;}
    50%{top:96%;}
    100%{top:0%;}
  }
  .scan-label{
    font-family:'IBM Plex Mono',monospace;color:var(--laser);font-size:13px;letter-spacing:.04em;
  }

  /* crop modal (recorte de bordes) */
  .crop-modal{
    position:fixed;inset:0;background:rgba(10,12,16,0.94);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    z-index:60;padding:20px;gap:16px;
  }
  .crop-modal.active{display:flex;}
  .crop-header{
    color:#e8e7e2;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    text-align:center;letter-spacing:.03em;max-width:420px;
  }
  .crop-header b{color:var(--laser);}
  .crop-stage-wrap{
    position:relative;
    border-radius:8px;overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,0.5);
    touch-action:none;
  }
  .crop-stage-wrap canvas{display:block;}
  .crop-stage-wrap svg{position:absolute;top:0;left:0;touch-action:none;}
  .crop-poly{
    fill:rgba(0,200,150,0.16);
    stroke:var(--laser);
    stroke-width:2.5;
  }
  .crop-handle{
    fill:#fff;
    stroke:var(--laser);
    stroke-width:3;
    cursor:grab;
    touch-action:none;
  }
  .crop-handle:active{cursor:grabbing;}
  .crop-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  /* bottom bar */
  .bottom-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--panel);border-top:1px solid var(--line);
    padding:14px 20px;
    display:flex;align-items:center;justify-content:center;gap:14px;
    box-shadow:0 -8px 24px rgba(0,0,0,0.05);
  }
  .bottom-bar .info{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--steel);}

  @media (max-width:520px){
    .brand h1{font-size:22px;}
    .action-row{flex-direction:column;}
    .action-row .btn{width:100%;justify-content:center;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="app-header">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="10" width="30" height="26" rx="2.5" stroke="#12151b" stroke-width="2.2"/>
        <path d="M12 18h18M12 24h18M12 30h11" stroke="#12151b" stroke-width="2.2" stroke-linecap="round"/>
        <rect x="4" y="6" width="34" height="4" rx="2" fill="#00c896"/>
      </svg>
      <div>
        <h1>Escanea</h1>
        <p>Foto o PDF → recorte automático de bordes → PDF nítido</p>
      </div>
    </div>
    <div class="counter"><b id="pageCount">0</b> página(s) en la pila</div>
  </header>

  <div class="panel">
    <div class="action-row">
      <button class="btn primary" id="btnCamera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-2h7l1 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Tomar foto
      </button>
      <button class="btn" id="btnImages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="8" cy="9" r="1.5"/></svg>
        Subir imágenes
      </button>
      <button class="btn" id="btnPdf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/></svg>
        Subir PDF
      </button>
      <input type="file" id="cameraInput" accept="image/*" capture="environment">
      <input type="file" id="imageInput" accept="image/*" multiple>
      <input type="file" id="pdfInput" accept="application/pdf">
    </div>

    <div class="mode-row">
      <span class="label">MODO DE ESCANEO</span>
      <div class="segmented" id="modeSeg">
        <button data-mode="color" class="active">Color</button>
        <button data-mode="gray">Escala de grises</button>
        <button data-mode="bn">Blanco y negro</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="pages" id="pages"></div>
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
      <p>Todavía no hay páginas.</p>
      <p class="hint">Toma una foto o sube imágenes/PDF para empezar</p>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <span class="info" id="bottomInfo">0 páginas listas</span>
  <button class="btn laser" id="btnDownload" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v13"/><path d="m7 12 5 5 5-5"/><path d="M5 21h14"/></svg>
    Descargar PDF
  </button>
</div>

<!-- overlay de mejora de imagen -->
<div class="scan-overlay" id="scanOverlay">
  <div class="scan-stage">
    <img id="scanPreviewImg" src="" alt="">
    <div class="scan-beam"></div>
  </div>
  <div class="scan-label" id="scanLabel">MEJORANDO IMAGEN…</div>
</div>

<!-- modal de recorte de bordes -->
<div class="crop-modal" id="cropModal">
  <div class="crop-header" id="cropHeader">Ajusta las esquinas del documento y confirma el recorte</div>
  <div class="crop-stage-wrap" id="cropStageWrap">
    <canvas id="cropDisplayCanvas"></canvas>
    <svg id="cropSvg"></svg>
  </div>
  <div class="crop-actions">
    <button class="btn ghost" id="btnCropFull" style="color:#e8e7e2;border-color:#3a4150;">Usar imagen completa</button>
    <button class="btn laser" id="btnCropConfirm">Confirmar recorte</button>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const state = { pages: [], mode: 'color', seq: 0 };
const MAX_DIM = 1900;      // tamaño final de página
const DETECT_MAX_DIM = 2200; // tamaño usado para capturar/recortar

const el = {
  pages: document.getElementById('pages'),
  emptyState: document.getElementById('emptyState'),
  pageCount: document.getElementById('pageCount'),
  bottomInfo: document.getElementById('bottomInfo'),
  btnDownload: document.getElementById('btnDownload'),
  scanOverlay: document.getElementById('scanOverlay'),
  scanPreviewImg: document.getElementById('scanPreviewImg'),
  scanLabel: document.getElementById('scanLabel'),
  cropModal: document.getElementById('cropModal'),
  cropHeader: document.getElementById('cropHeader'),
  cropStageWrap: document.getElementById('cropStageWrap'),
  cropDisplayCanvas: document.getElementById('cropDisplayCanvas'),
  cropSvg: document.getElementById('cropSvg'),
  btnCropFull: document.getElementById('btnCropFull'),
  btnCropConfirm: document.getElementById('btnCropConfirm'),
};

document.getElementById('btnCamera').onclick = () => document.getElementById('cameraInput').click();
document.getElementById('btnImages').onclick = () => document.getElementById('imageInput').click();
document.getElementById('btnPdf').onclick = () => document.getElementById('pdfInput').click();

document.getElementById('cameraInput').onchange = e => handleImageFiles(e.target.files);
document.getElementById('imageInput').onchange = e => handleImageFiles(e.target.files);
document.getElementById('pdfInput').onchange = e => handlePdfFile(e.target.files[0]);

document.querySelectorAll('#modeSeg button').forEach(btn=>{
  btn.onclick = () => {
    document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
  };
});

function showOverlay(previewSrc, label){
  el.scanPreviewImg.src = previewSrc || '';
  el.scanLabel.textContent = label || 'MEJORANDO IMAGEN…';
  el.scanOverlay.classList.add('active');
}
function hideOverlay(){ el.scanOverlay.classList.remove('active'); }

/* ---------------- flujo de captura/subida ---------------- */

async function handleImageFiles(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  for(const file of files){
    await processImageFile(file);
  }
  document.getElementById('cameraInput').value = '';
  document.getElementById('imageInput').value = '';
}

async function processImageFile(file){
  const dataUrl = await fileToDataUrl(file);
  const rawCanvas = await loadImageToCanvas(dataUrl, DETECT_MAX_DIM);

  // recorte de bordes, estilo Google Drive: auto-detecta y permite ajustar
  const croppedCanvas = await openCropModal(rawCanvas);

  showOverlay(croppedCanvas.toDataURL('image/jpeg', 0.85), 'MEJORANDO IMAGEN…');
  await new Promise(r=>requestAnimationFrame(r));
  const finalCanvas = capDimension(croppedCanvas, MAX_DIM);
  enhanceCanvas(finalCanvas, state.mode);
  addPage(finalCanvas);
  hideOverlay();
}

async function handlePdfFile(file){
  if(!file) return;
  showOverlay('', 'LEYENDO PDF…');
  await new Promise(r=>requestAnimationFrame(r));
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  for(let i=1;i<=pdf.numPages;i++){
    el.scanLabel.textContent = `MEJORANDO PÁGINA ${i} DE ${pdf.numPages}…`;
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale: 2.0});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({canvasContext: ctx, viewport}).promise;
    el.scanPreviewImg.src = canvas.toDataURL('image/jpeg', 0.85);
    await new Promise(r=>requestAnimationFrame(r));
    // las páginas de un PDF ya son rectangulares: no necesitan recorte de bordes
    enhanceCanvas(canvas, state.mode);
    addPage(canvas);
  }
  hideOverlay();
  document.getElementById('pdfInput').value = '';
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function loadImageToCanvas(dataUrl, maxDim){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, maxDim / Math.max(w,h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas);
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function capDimension(canvas, maxDim){
  const w = canvas.width, h = canvas.height;
  const scale = Math.min(1, maxDim / Math.max(w,h));
  if(scale >= 1) return canvas;
  const out = document.createElement('canvas');
  out.width = Math.round(w*scale);
  out.height = Math.round(h*scale);
  out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
  return out;
}

/* ---------------- recorte automático de bordes (estilo Google Drive) ---------------- */

function orderPoints(pts){
  const sum = p => p.x + p.y;
  const diff = p => p.x - p.y;
  const tl = pts.reduce((a,b)=> sum(a) < sum(b) ? a : b);
  const br = pts.reduce((a,b)=> sum(a) > sum(b) ? a : b);
  const tr = pts.reduce((a,b)=> diff(a) > diff(b) ? a : b);
  const bl = pts.reduce((a,b)=> diff(a) < diff(b) ? a : b);
  return [tl,tr,br,bl];
}

function detectDocumentCorners(canvas){
  if(typeof cv === 'undefined' || !cvReady) return null;
  let src, gray, blurred, edges, kernel, contours, hierarchy;
  try{
    src = cv.imread(canvas);
    gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    blurred = new cv.Mat();
    cv.GaussianBlur(gray, blurred, new cv.Size(5,5), 0);
    edges = new cv.Mat();
    cv.Canny(blurred, edges, 50, 150);
    kernel = cv.Mat.ones(3,3,cv.CV_8U);
    cv.dilate(edges, edges, kernel);

    contours = new cv.MatVector();
    hierarchy = new cv.Mat();
    cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

    const imgArea = src.rows * src.cols;
    let bestPoints = null, bestArea = 0;

    for(let i=0;i<contours.size();i++){
      const cnt = contours.get(i);
      const peri = cv.arcLength(cnt, true);
      const approx = new cv.Mat();
      cv.approxPolyDP(cnt, approx, 0.02*peri, true);
      if(approx.rows === 4){
        const area = Math.abs(cv.contourArea(approx));
        if(area > bestArea && area > imgArea*0.15){
          bestArea = area;
          bestPoints = [];
          for(let k=0;k<4;k++){
            bestPoints.push({ x: approx.data32S[k*2], y: approx.data32S[k*2+1] });
          }
        }
      }
      approx.delete();
      cnt.delete();
    }
    return bestPoints ? orderPoints(bestPoints) : null;
  }catch(e){
    console.warn('Detección automática falló:', e);
    return null;
  }finally{
    [src,gray,blurred,edges,kernel,contours,hierarchy].forEach(m => { if(m && m.delete) m.delete(); });
  }
}

function warpPerspective(canvas, orderedPts){
  const [tl,tr,br,bl] = orderedPts;
  const widthA = Math.hypot(br.x-bl.x, br.y-bl.y);
  const widthB = Math.hypot(tr.x-tl.x, tr.y-tl.y);
  const maxWidth = Math.max(widthA, widthB);
  const heightA = Math.hypot(tr.x-br.x, tr.y-br.y);
  const heightB = Math.hypot(tl.x-bl.x, tl.y-bl.y);
  const maxHeight = Math.max(heightA, heightB);

  if(typeof cv === 'undefined' || !cvReady || maxWidth < 10 || maxHeight < 10){
    // fallback: recorte rectangular simple (sin corrección de perspectiva)
    const xs = orderedPts.map(p=>p.x), ys = orderedPts.map(p=>p.y);
    const minX = Math.max(0, Math.min(...xs)), maxX = Math.min(canvas.width, Math.max(...xs));
    const minY = Math.max(0, Math.min(...ys)), maxY = Math.min(canvas.height, Math.max(...ys));
    const out = document.createElement('canvas');
    out.width = Math.max(1, Math.round(maxX-minX));
    out.height = Math.max(1, Math.round(maxY-minY));
    out.getContext('2d').drawImage(canvas, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
    return out;
  }

  let src, srcTri, dstTri, M, dst;
  try{
    src = cv.imread(canvas);
    srcTri = cv.matFromArray(4,1,cv.CV_32FC2, [tl.x,tl.y, tr.x,tr.y, br.x,br.y, bl.x,bl.y]);
    dstTri = cv.matFromArray(4,1,cv.CV_32FC2, [0,0, maxWidth,0, maxWidth,maxHeight, 0,maxHeight]);
    M = cv.getPerspectiveTransform(srcTri, dstTri);
    dst = new cv.Mat();
    cv.warpPerspective(src, dst, M, new cv.Size(maxWidth, maxHeight), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());
    const out = document.createElement('canvas');
    out.width = Math.round(maxWidth);
    out.height = Math.round(maxHeight);
    cv.imshow(out, dst);
    return out;
  }finally{
    [src,srcTri,dstTri,M,dst].forEach(m => { if(m && m.delete) m.delete(); });
  }
}

let cropDragState = { activePoint: null, points: [] };

function openCropModal(canvas){
  return new Promise(resolve => {
    const maxW = Math.min(window.innerWidth - 48, 460);
    const maxH = Math.min(window.innerHeight - 230, 620);
    const scale = Math.min(1, maxW / canvas.width, maxH / canvas.height);
    const dispW = Math.max(60, Math.round(canvas.width*scale));
    const dispH = Math.max(60, Math.round(canvas.height*scale));

    el.cropDisplayCanvas.width = dispW;
    el.cropDisplayCanvas.height = dispH;
    el.cropDisplayCanvas.getContext('2d').drawImage(canvas, 0, 0, dispW, dispH);

    el.cropSvg.setAttribute('viewBox', `0 0 ${dispW} ${dispH}`);
    el.cropSvg.setAttribute('width', dispW);
    el.cropSvg.setAttribute('height', dispH);
    el.cropStageWrap.style.width = dispW + 'px';
    el.cropStageWrap.style.height = dispH + 'px';

    el.cropHeader.textContent = cvReady
      ? 'Detectamos el documento. Ajusta las esquinas si hace falta y confirma.'
      : 'Arrastra las esquinas para encuadrar el documento y confirma.';

    let detected = null;
    try{ detected = detectDocumentCorners(canvas); }catch(e){ detected = null; }

    let points;
    if(detected){
      points = detected.map(p => ({ x: p.x*scale, y: p.y*scale }));
    } else {
      const m = 0.06;
      points = [
        { x: dispW*m,     y: dispH*m     },
        { x: dispW*(1-m), y: dispH*m     },
        { x: dispW*(1-m), y: dispH*(1-m) },
        { x: dispW*m,     y: dispH*(1-m) },
      ];
    }
    cropDragState.points = points;

    renderCropOverlay();
    el.cropModal.classList.add('active');

    function onDone(useFull){
      el.cropModal.classList.remove('active');
      el.cropSvg.innerHTML = '';
      if(useFull){
        resolve(canvas);
      } else {
        const fullPts = cropDragState.points.map(p => ({ x: p.x/scale, y: p.y/scale }));
        try{
          const warped = warpPerspective(canvas, fullPts);
          resolve(warped);
        }catch(e){
          console.warn('Recorte falló, usando imagen completa:', e);
          resolve(canvas);
        }
      }
    }

    el.btnCropConfirm.onclick = () => onDone(false);
    el.btnCropFull.onclick = () => onDone(true);
  });
}

function renderCropOverlay(){
  const svg = el.cropSvg;
  svg.innerHTML = '';
  const pts = cropDragState.points;
  const ns = 'http://www.w3.org/2000/svg';

  const poly = document.createElementNS(ns, 'polygon');
  poly.setAttribute('points', pts.map(p=>`${p.x},${p.y}`).join(' '));
  poly.setAttribute('class', 'crop-poly');
  svg.appendChild(poly);

  pts.forEach((p, idx) => {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', p.x);
    c.setAttribute('cy', p.y);
    c.setAttribute('r', 12);
    c.setAttribute('class', 'crop-handle');
    c.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      cropDragState.activePoint = idx;
      c.setPointerCapture(ev.pointerId);
    });
    c.addEventListener('pointermove', ev => {
      if(cropDragState.activePoint !== idx) return;
      const rect = svg.getBoundingClientRect();
      const scaleX = svg.viewBox.baseVal.width / rect.width;
      const scaleY = svg.viewBox.baseVal.height / rect.height;
      let x = (ev.clientX - rect.left) * scaleX;
      let y = (ev.clientY - rect.top) * scaleY;
      x = Math.max(0, Math.min(svg.viewBox.baseVal.width, x));
      y = Math.max(0, Math.min(svg.viewBox.baseVal.height, y));
      cropDragState.points[idx] = { x, y };
      renderCropOverlay();
    });
    c.addEventListener('pointerup', ev => {
      cropDragState.activePoint = null;
    });
    svg.appendChild(c);
  });
}

/* ---------------- mejora de imagen (niveles, contraste, nitidez) ---------------- */

function clamp(v){ return v<0?0:(v>255?255:v); }

function percentileBounds(hist, total){
  const lowCut = total*0.006, highCutFromTop = total*0.006;
  let cum=0, lo=0, hi=255;
  for(let v=0;v<256;v++){ cum+=hist[v]; if(cum>=lowCut){ lo=v; break; } }
  cum=0;
  for(let v=255;v>=0;v--){ cum+=hist[v]; if(cum>=highCutFromTop){ hi=v; break; } }
  if(hi<=lo){ lo=0; hi=255; }
  return [lo,hi];
}

function enhanceCanvas(canvas, mode){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0,0,w,h);
  const data = imgData.data;
  const total = w*h;

  if(mode === 'gray' || mode === 'bn'){
    for(let i=0;i<data.length;i+=4){
      const lum = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
      data[i] = data[i+1] = data[i+2] = lum;
    }
  }

  const histR = new Array(256).fill(0), histG = new Array(256).fill(0), histB = new Array(256).fill(0);
  for(let i=0;i<data.length;i+=4){
    histR[data[i]]++; histG[data[i+1]]++; histB[data[i+2]]++;
  }
  const [rlo,rhi] = percentileBounds(histR, total);
  const [glo,ghi] = percentileBounds(histG, total);
  const [blo,bhi] = percentileBounds(histB, total);

  const contrastFactor = mode === 'bn' ? 1.55 : (mode === 'gray' ? 1.3 : 1.18);
  const brightnessBoost = mode === 'bn' ? 10 : 6;

  for(let i=0;i<data.length;i+=4){
    let r = (data[i]-rlo) * 255/Math.max(1,(rhi-rlo));
    let g = (data[i+1]-glo) * 255/Math.max(1,(ghi-glo));
    let b = (data[i+2]-blo) * 255/Math.max(1,(bhi-blo));

    r = (r-128)*contrastFactor + 128 + brightnessBoost;
    g = (g-128)*contrastFactor + 128 + brightnessBoost;
    b = (b-128)*contrastFactor + 128 + brightnessBoost;

    if(mode === 'color'){
      const avg = (r+g+b)/3;
      r = avg + (r-avg)*1.12;
      g = avg + (g-avg)*1.12;
      b = avg + (b-avg)*1.12;
    }

    data[i] = clamp(r);
    data[i+1] = clamp(g);
    data[i+2] = clamp(b);
  }

  ctx.putImageData(imgData, 0, 0);
  sharpen(ctx, w, h);
}

function sharpen(ctx, w, h){
  const src = ctx.getImageData(0,0,w,h);
  const out = ctx.createImageData(w,h);
  const s = src.data, o = out.data;
  const kernel = [0,-0.6,0, -0.6,3.4,-0.6, 0,-0.6,0];
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const idx = (y*w+x)*4;
      if(x===0||y===0||x===w-1||y===h-1){
        o[idx]=s[idx]; o[idx+1]=s[idx+1]; o[idx+2]=s[idx+2]; o[idx+3]=s[idx+3];
        continue;
      }
      let r=0,g=0,b=0,k=0;
      for(let ky=-1;ky<=1;ky++){
        for(let kx=-1;kx<=1;kx++){
          const nIdx = ((y+ky)*w+(x+kx))*4;
          const weight = kernel[k++];
          r += s[nIdx]*weight;
          g += s[nIdx+1]*weight;
          b += s[nIdx+2]*weight;
        }
      }
      o[idx]=clamp(r); o[idx+1]=clamp(g); o[idx+2]=clamp(b); o[idx+3]=s[idx+3];
    }
  }
  ctx.putImageData(out,0,0);
}

/* ---------------- pila de páginas ---------------- */

function addPage(canvas){
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  state.pages.push({ id: ++state.seq, dataUrl, w: canvas.width, h: canvas.height });
  render();
}

function rotatePage(id){
  const p = state.pages.find(p=>p.id===id);
  if(!p) return;
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalHeight;
    canvas.height = img.naturalWidth;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(Math.PI/2);
    ctx.drawImage(img, -img.naturalWidth/2, -img.naturalHeight/2);
    p.dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    p.w = canvas.width; p.h = canvas.height;
    render();
  };
  img.src = p.dataUrl;
}

function deletePage(id){
  state.pages = state.pages.filter(p=>p.id!==id);
  render();
}

function movePage(id, dir){
  const idx = state.pages.findIndex(p=>p.id===id);
  const newIdx = idx+dir;
  if(newIdx<0 || newIdx>=state.pages.length) return;
  const tmp = state.pages[idx];
  state.pages[idx] = state.pages[newIdx];
  state.pages[newIdx] = tmp;
  render();
}

function render(){
  el.pages.innerHTML = '';
  el.emptyState.style.display = state.pages.length ? 'none' : 'block';
  state.pages.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'page-card';
    card.innerHTML = `
      <div class="thumb-wrap">
        <span class="page-index">${i+1}</span>
        <img src="${p.dataUrl}" alt="Página ${i+1}">
      </div>
      <div class="page-tools">
        <button title="Subir" data-act="up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg></button>
        <button title="Bajar" data-act="down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
        <button title="Rotar" data-act="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
        <button title="Eliminar" class="del" data-act="del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg></button>
      </div>
    `;
    card.querySelector('[data-act="up"]').onclick = () => movePage(p.id, -1);
    card.querySelector('[data-act="down"]').onclick = () => movePage(p.id, 1);
    card.querySelector('[data-act="rotate"]').onclick = () => rotatePage(p.id);
    card.querySelector('[data-act="del"]').onclick = () => deletePage(p.id);
    el.pages.appendChild(card);
  });

  el.pageCount.textContent = state.pages.length;
  el.bottomInfo.textContent = state.pages.length === 1 ? '1 página lista' : `${state.pages.length} páginas listas`;
  el.btnDownload.disabled = state.pages.length === 0;
}

el.btnDownload.onclick = async () => {
  if(!state.pages.length) return;
  el.btnDownload.disabled = true;
  el.btnDownload.textContent = 'Generando…';
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();

  state.pages.forEach((p, i) => {
    if(i>0) pdf.addPage();
    const imgRatio = p.w / p.h;
    const pageRatio = pageW / pageH;
    let drawW, drawH;
    if(imgRatio > pageRatio){
      drawW = pageW;
      drawH = pageW / imgRatio;
    } else {
      drawH = pageH;
      drawW = pageH * imgRatio;
    }
    const x = (pageW - drawW) / 2;
    const y = (pageH - drawH) / 2;
    pdf.addImage(p.dataUrl, 'JPEG', x, y, drawW, drawH, undefined, 'FAST');
  });

  pdf.save('documento-escaneado.pdf');
  el.btnDownload.disabled = false;
  el.btnDownload.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v13"/><path d="m7 12 5 5 5-5"/><path d="M5 21h14"/></svg> Descargar PDF`;
};

render();
</script>
